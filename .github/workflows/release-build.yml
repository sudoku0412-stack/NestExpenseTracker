name: Release build + submit

# Every push to main (non-docs) → local Android production .aab on the
# GitHub runner (no EAS cloud build credits, no Play/App Store auto-submit).
# Download the artifact from the run and upload to Play Console by hand.
#
# Why local, not `eas build` cloud:
#   The Expo Free plan's included cloud builds run out mid-month and block
#   every main push. `eas build --local` still uses Expo credentials/keystore
#   from the cloud but compiles on GitHub's free minutes — same signed .aab,
#   no quota burn. iOS stays out of this workflow (local Xcode / TestFlight
#   is the standing release path; see HANDOVER.md).
#
# Name kept as "Release build + submit" so existing Actions bookmarks and
# badges don't break; submit is intentionally disabled.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'landing/**'
      - 'web/**'
      - 'workers/**'
  workflow_dispatch:

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  test:
    name: Test suites
    uses: ./.github/workflows/test.yml

  android:
    name: Build Android AAB (local)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Stage google-services.json for EAS local build
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON_CONTENT }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            echo "::error::Missing repo secret GOOGLE_SERVICES_JSON_CONTENT — paste the contents of google-services.json into Settings → Secrets → Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))"

          # eas-cli archives via .easignore / .gitignore; google-services.json
          # is gitignored, so strip that line for the runner-only archive.
          grep -v '^google-services\.json$' .gitignore > .easignore
          echo "google-services.json staged ($(wc -c < google-services.json) bytes)"

      - name: EAS local production AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Include gitignored google-services.json in the archive.
          EAS_NO_VCS: '1'
          REVENUECAT_API_KEY_ANDROID: ${{ secrets.REVENUECAT_API_KEY_ANDROID }}
          REVENUECAT_API_KEY_IOS: ${{ secrets.REVENUECAT_API_KEY_IOS }}
        run: |
          ls -la google-services.json
          # production profile → app-bundle (.aab) per eas.json.
          # No --auto-submit: upload to Play Console manually from Artifacts.
          eas build \
            --profile production \
            --platform android \
            --local \
            --non-interactive \
            --output ./build-output.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestexpensetracker-production-aab-${{ github.sha }}
          path: build-output.aab
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Android production AAB (local, no submit)"
            echo ""
            echo "- Profile: \`production\`"
            echo "- Output: \`build-output.aab\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Status: \`${{ job.status }}\`"
            echo "- Auto-submit: **disabled** (download artifact → upload in Play Console)"
            echo ""
            if [ -f build-output.aab ]; then
              SIZE=$(du -h build-output.aab | cut -f1)
              echo "- Artifact size: $SIZE"
              echo ""
              echo "Download from the **Artifacts** section above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
